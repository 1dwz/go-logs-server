name: Build Windows EXE

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.19'

    - name: Download dependencies
      run: go mod download

    - name: Build Windows EXE
      run: |
        go build -o logs-server.exe ./cmd/server/main.go

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: logs-server-windows
        path: logs-server.exe
        retention-days: 7
