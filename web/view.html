<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志详情</title>
    <link rel="stylesheet" href="/static/app.css">
</head>
<body>
    <main class="page">
        <a class="back-link" href="/">‹ 返回主页</a>
        <header class="header">
            <div>
                <h1 id="pageTitle">日志详情</h1>
                <p class="subtitle">日志详情页面</p>
            </div>
            <div class="stat-card">
                <div class="stat-label">当前显示</div>
                <div><span class="stat-value" id="logCount">0</span> 条</div>
            </div>
        </header>

        <section class="panel">
            <div class="toolbar">
                <div class="control">
                    <span>自动刷新</span>
                    <button id="autoRefreshBtn" class="btn primary" type="button">开启</button>
                </div>
                <div class="control">
                    <span>级别筛选</span>
                    <select id="levelFilter" class="select">
                        <option value="" selected>全部</option>
                        <option value="info">Info</option>
                        <option value="warn">Warn</option>
                        <option value="error">Error</option>
                        <option value="debug">Debug</option>
                    </select>
                </div>
                <div class="control grow">
                    <span>标签</span>
                    <div id="tagFilters" class="tag-list"><span class="subtitle">加载中...</span></div>
                </div>
                <button id="exportBtn" class="btn accent" type="button">导出 JSON</button>
                <button id="clearBtn" class="btn danger" type="button">清空日志</button>
            </div>
        </section>

        <section id="logStream" class="log-list">
            <div class="loading">加载中...</div>
        </section>
        <nav id="pagination" class="pagination"></nav>
    </main>

    <div id="modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <strong>日志详情</strong>
                <button id="closeModalBtn" class="btn" type="button">关闭</button>
            </div>
            <div id="modalContent" class="modal-content"></div>
        </div>
    </div>

    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-overlay"></div>
        <div class="confirm-dialog">
            <div class="confirm-icon" id="confirmIcon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>
            <h3 id="confirmTitle" class="confirm-title">确认操作</h3>
            <p id="confirmMessage" class="confirm-message">确定要执行此操作吗？</p>
            <div class="confirm-info" id="confirmInfo"></div>
            <div class="confirm-actions">
                <button id="confirmCancelBtn" class="btn" type="button" style="display:none;">取消</button>
                <button id="confirmBtn" class="btn" type="button">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/view.js"></script>
</body>
</html>
